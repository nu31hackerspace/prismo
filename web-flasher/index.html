<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prismo Web Flasher</title>
    <meta name="description" content="Flash latest Prismo firmware to your ESP32-C3 directly from your browser.">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0F172A; /* Slate 900 */
            --text-primary: #F8FAFC; /* Slate 50 */
            --text-secondary: #94A3B8; /* Slate 400 */
            --accent: #3B82F6; /* Blue 500 */
            --accent-hover: #2563EB; /* Blue 600 */
            --accent-glow: rgba(59, 130, 246, 0.4);
            --card-bg: rgba(30, 41, 59, 0.7); /* Slate 800 with opacity */
            --card-border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Dynamic smooth gradient background */
            background-image: 
                radial-gradient(circle at top right, rgba(59, 130, 246, 0.15), transparent 40%),
                radial-gradient(circle at bottom left, rgba(147, 51, 234, 0.15), transparent 40%);
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 2rem;
            position: relative;
            z-index: 10;
        }

        /* Glassmorphic card styling */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 3rem 2rem;
            text-align: center;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5),
                        0 0 0 1px inset rgba(255, 255, 255, 0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            overflow: hidden;
            /* Micro-animation on load */
            animation: fadeInUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(30px);
        }

        /* Highlight top edge */
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.25), transparent);
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.6),
                        0 0 0 1px inset rgba(255, 255, 255, 0.08);
        }

        .header {
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            background: linear-gradient(135deg, #FFFFFF, #94A3B8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.025em;
        }

        p {
            color: var(--text-secondary);
            font-size: 1rem;
            line-height: 1.6;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-top: 1.5rem;
            font-size: 0.875rem;
            font-weight: 500;
            color: #E2E8F0;
            background: rgba(15, 23, 42, 0.6);
            padding: 0.5rem 1.25rem;
            border-radius: 9999px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* Pulsing indicator */
        .pulse {
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: #10B981; /* Emerald 500 */
            border-radius: 50%;
            margin-right: 10px;
            box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
            animation: pulse-ring 2s infinite;
        }

        .button-area {
            margin: 2.5rem 0 1.5rem 0;
            min-height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Styling for the native esp-web-tools button parts (if supported) */
        esp-web-install-button {
            --esp-tools-button-color: var(--accent);
            --esp-tools-button-text-color: #ffffff;
            --esp-tools-button-border-radius: 9999px;
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        esp-web-install-button::part(button) {
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 9999px;
            padding: 1rem 2.5rem;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 1.05rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px 0 var(--accent-glow);
            letter-spacing: 0.025em;
        }

        esp-web-install-button::part(button):hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.5);
        }
        
        esp-web-install-button::part(button):active {
            transform: translateY(1px);
        }

        .footer {
            margin-top: 2rem;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        /* Animations */
        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <h1>Prismo Flasher</h1>
                <p>Install the latest custom firmware to your ESP32-C3 device securely from your browser via Web Serial.</p>
            </div>
            
            <div class="status-badge">
                <span class="pulse"></span> Ready to connect device
            </div>

            <div class="button-area">
                <!-- Load the ESP Web Tools script -->
                <script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>
                
                <!-- The Web Component -->
                <esp-web-install-button manifest="manifest.json"></esp-web-install-button>
            </div>

            <div class="footer">
                <p>Supports Chrome, Edge, and Opera desktop browsers.<br>Ensure your board is connected via USB.</p>
            </div>
        </div>
    </div>
</body>
</html>
