version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=prismo
    ports:
      - '5432:5432'
    volumes:
      - prismo-db-data:/var/lib/postgresql/data
    networks:
      - prismo-net

  pgadmin:
    image: dpage/pgadmin4
    restart: always
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@prismo.nu31.space
      - PGADMIN_DEFAULT_PASSWORD=admin
    ports:
      - '5050:80'
    depends_on:
      - db
    networks:
      - prismo-net

networks:
  prismo-net:
    driver: overlay
    attachable: true
    driver_opts:
      encrypted: 'true'

volumes:
  prismo-db-data:
