<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32-C3 Firmware Web Flasher</title>
    <!-- Import ESP Web Tools script -->
    <script type="module" src="https://unpkg.com/esp-web-tools@9.4.2/dist/web/install-button.js?module"></script>
    <style>
        body {
            font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, Ubuntu;
            padding: 2rem;
            max-width: 600px;
            margin: 0 auto;
            text-align: center;
        }
        .container {
            background-color: #f9f9f9;
            border-radius: 8px;
            padding: 2rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Install Custom ESP32-C3 Firmware</h1>
        <p>Connect your ESP32-C3 board via USB, then click the button below to flash the MicroPython firmware with built-in custom scripts.</p>
        
        <!-- The esp-web-install-button component -->
        <esp-web-install-button manifest="manifest.json"></esp-web-install-button>
        
        <p style="margin-top: 2rem; font-size: 0.9em; color: #666;">
            <strong>Note:</strong> You must use a browser that supports Web Serial (such as Google Chrome or Microsoft Edge).
        </p>
    </div>
</body>
</html>
