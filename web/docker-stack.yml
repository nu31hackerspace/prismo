version: '3.8'

services:
  app:
    image: ghcr.io/${IMAGE_NAME}:${COMMIT_SHA}
    deploy:
      update_config:
        order: start-first
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - ORIGIN=${ORIGIN}
      - COMMIT_SHA=${COMMIT_SHA}
    networks:
      - infra_reverse-proxy
      - infra_postgres-net
    healthcheck:
      test: ['wget', '--spider', '-q', 'http://127.0.0.1:3000/health']
      interval: 15s
      timeout: 30s
      retries: 4
      start_period: 60s

networks:
  infra_reverse-proxy:
    external: true
  infra_postgres-net:
    external: true
