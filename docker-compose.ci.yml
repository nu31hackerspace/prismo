# Infrastructure for the CI E2E job — same services as docker-compose.dev.yml
# minus the app container, which CI runs directly on the runner.
services:
  postgres:
    image: postgres:16
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=prismo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d prismo"]
      interval: 3s
      timeout: 3s
      retries: 10

  mqtt:
    build: ./mosquitto
    ports:
      - '1883:1883'
    environment:
      - MQTT_ADMIN_USER=admin
      - MQTT_ADMIN_PASSWORD=admin
    healthcheck:
      test: mosquitto_sub -h localhost -p 1883 -u admin -P admin -t '$$SYS/#' -C 1 -W 2
      interval: 3s
      timeout: 5s
      retries: 10

