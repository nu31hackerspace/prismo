services:
  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=prismo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d prismo"]
      interval: 3s
      timeout: 3s
      retries: 10

  mqtt:
    build: ../mosquitto
    image: prismo-mqtt:blackbox
    ports:
      - "1883:1883"
    environment:
      - MQTT_ADMIN_USER=admin
      - MQTT_ADMIN_PASSWORD=admin
    healthcheck:
      test: mosquitto_sub -h localhost -p 1883 -u admin -P admin -t '$$SYS/#' -C 1 -W 2
      interval: 3s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    image: prismo-backend:blackbox
    depends_on:
      postgres:
        condition: service_healthy
      mqtt:
        condition: service_healthy
    environment:
      - PORT=4000
      - POSTGRES_URL=postgresql://admin:admin@postgres:5432/prismo
      - MQTT_URL=mqtt://admin:admin@mqtt:1883
      - SESSION_SECRET=blackbox-secret-not-for-production
      - USERNAME=admin
      - PASSWORD=admin
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/health"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 20s

  client:
    build:
      context: ..
      dockerfile: client/Dockerfile
    image: prismo-client:blackbox
    environment:
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5173/"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 20s

  # Same-origin routing in front of backend + client, mirroring the Caddy
  # setup docker-stack.yml uses in production — this is what makes cookies
  # and the socket.io handshake work without CORS.
  caddy:
    image: caddy:2-alpine
    ports:
      - "13000:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      backend:
        condition: service_healthy
      client:
        condition: service_healthy

