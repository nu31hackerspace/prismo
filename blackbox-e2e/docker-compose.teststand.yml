# Test-stand overlay for the hardware-in-the-loop e2e run.
#
# Layer on top of docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.teststand.yml up -d
#
# Difference from the local blackbox stack: backend and client are the images
# CI built for this commit instead of local builds. The browser reaches
# everything through Caddy on the published port 13000 — same-origin, so
# there's no ORIGIN/CORS setting to override here.

services:
  backend:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAME:-nu31hackerspace/prismo-web-admin}-backend:${IMAGE_TAG:-latest}

  client:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAME:-nu31hackerspace/prismo-web-admin}-client:${IMAGE_TAG:-latest}
