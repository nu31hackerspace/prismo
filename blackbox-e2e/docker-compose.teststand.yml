# Test-stand overlay for the hardware-in-the-loop e2e run.
#
# Layer on top of docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.teststand.yml up -d
#
# Difference from the local blackbox stack: Google OAuth is NOT mocked here.
# The test seeds a session directly (its one allowed DB shortcut) and drives the
# genuine production auth path, so we turn TEST_MODE off. ORIGIN tracks the host
# the browser actually uses (defaults to the published port 13000).

services:
  app:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAME:-nu31hackerspace/prismo-web-admin}:${IMAGE_TAG:-latest}
    environment:
      # Empty string is falsy in google-auth.ts → real OAuth client.
      - TEST_MODE=
      - ORIGIN=${TESTSTAND_ORIGIN:-http://localhost:13000}

  worker:
    image: ${REGISTRY:-ghcr.io}/${WORKER_IMAGE_NAME:-nu31hackerspace/prismo-worker}:${IMAGE_TAG:-latest}
    environment:
      # The worker bakes MQTT_URL into the firmware it builds (same role as
      # PUBLIC_MQTT_URL in docker-stack.yml), so it must be the broker address
      # as the *device* reaches it — the AP's gateway IP, not the docker-network
      # hostname `mqtt` from the base compose file.
      - MQTT_URL=mqtt://${TESTSTAND_MQTT_HOST:-192.168.10.1}:${TESTSTAND_MQTT_PORT:-1883}
      # Baked into the firmware so the device's boot log identifies the build.
      - COMMIT_SHA=${COMMIT_SHA:-dev}
