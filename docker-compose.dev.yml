# Local development stack. Start it with `./dev.sh` — that script wraps this
# file, waits for the services to become healthy and prints the URLs.
#
# Host ports can be remapped in the root `.env` (see `.env.example`) when
# something else on your machine already owns 3000 / 27017 / 1883 / 5000.
services:
  mongo:
    image: mongo:8
    ports:
      - '${MONGO_PORT:-27017}:27017'
    command: --replSet rs0
    volumes:
      - mongo-dev-data:/data/db
    healthcheck:
      test: mongosh --eval "db.runCommand({ping:1})" --quiet
      interval: 3s
      timeout: 3s
      retries: 10

  mongo-init:
    image: mongo:8
    depends_on:
      mongo:
        condition: service_healthy
    restart: 'no'
    entrypoint: >
      mongosh --host mongo --eval
      "try { rs.status() } catch(e) { rs.initiate({_id:'rs0', members:[{_id:0, host:'mongo:27017'}]}) }"

  mongo-viewer:
    image: haohanyang/compass-web:0.3.1
    restart: unless-stopped
    ports:
      - '${MONGO_VIEWER_PORT:-5000}:8080'
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      - CW_MONGO_URI=mongodb://mongo:27017/?directConnection=true
      - CW_BASIC_AUTH_USERNAME=admin
      - CW_BASIC_AUTH_PASSWORD=admin

  postgres:
    image: postgres:16
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=prismo
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d prismo"]
      interval: 3s
      timeout: 3s
      retries: 10

  postgres-viewer:
    image: dpage/pgadmin4
    restart: unless-stopped
    ports:
      - '${POSTGRES_VIEWER_PORT:-5050}:80'
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    depends_on:
      postgres:
        condition: service_healthy

  mqtt:
    build: ./mosquitto
    ports:
      - '${MQTT_PORT:-1883}:1883'
      - '9001:9001'
    environment:
      - MQTT_ADMIN_USER=admin
      - MQTT_ADMIN_PASSWORD=admin
    volumes:
      - mqtt-dev-data:/mosquitto/data
    healthcheck:
      test: mosquitto_sub -h localhost -p 1883 -u admin -P admin -t '$$SYS/#' -C 1 -W 2
      interval: 3s
      timeout: 5s
      retries: 10

  # backend and client are two independent apps sharing the `@prismo/shared`
  # npm workspace, so both mount the whole repo root (not just their own
  # subfolder) — that's what lets `npm install` at the root see and link the
  # workspace, the same way the production Dockerfiles build them.
  backend:
    image: node:22
    working_dir: /repo
    ports:
      - '${BACKEND_PORT:-4000}:4000'
    volumes:
      - .:/repo
      - repo-node-modules:/repo/node_modules
      - ./mosquitto:/mqtt
      - mqtt-tools-node-modules:/mqtt/node_modules
      - playwright-browsers:/root/.cache/ms-playwright
    depends_on:
      postgres:
        condition: service_healthy
      mqtt:
        condition: service_healthy
    environment:
      - PORT=4000
      - POSTGRES_URL=postgresql://admin:admin@postgres:5432/prismo
      - MQTT_URL=mqtt://admin:admin@mqtt:1883
      - SESSION_SECRET=dev-secret-not-for-production
      - USERNAME=admin
      - PASSWORD=admin
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - MQTT_BROKER=mqtt://mqtt:1883
      - MQTT_USER=admin
      - MQTT_PASSWORD=admin
    healthcheck:
      test: node -e "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s
    command:
      - bash
      - -c
      - |
        npm install
        npm run dev --workspace=backend

  client:
    image: node:22
    working_dir: /repo
    ports:
      - '${WEB_PORT:-3000}:5173'
      - '24678:24678'
    volumes:
      - .:/repo
      - repo-node-modules:/repo/node_modules
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - VITE_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
    command:
      - bash
      - -c
      - |
        npm install
        npm run dev --workspace=client -- --host 0.0.0.0

  # Firmware build worker. Heavy (~several GB image) and only needed when you
  # work on /flasher builds, so it is opt-in: `./dev.sh up --with-worker`.
  worker:
    image: ghcr.io/nu31hackerspace/prismo-worker:latest
    profiles: [worker]
    depends_on:
      mongo:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      mqtt:
        condition: service_healthy
    volumes:
      - ./backend/worker/worker.py:/worker/worker.py:ro
      - ./backend/worker/build.sh:/worker/build.sh:ro
    environment:
      - MONGODB_URL=mongodb://mongo:27017/prismo?directConnection=true&replicaSet=rs0
      - POSTGRES_URL=postgresql://admin:admin@postgres:5432/prismo
      - MQTT_URL=mqtt://admin:admin@mqtt:1883
    restart: on-failure

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - client
      - mongo-viewer
      - postgres-viewer

volumes:
  mongo-dev-data:
  postgres-dev-data:
  mqtt-dev-data:
  repo-node-modules:
  mqtt-tools-node-modules:
  playwright-browsers:
  caddy_data:
  caddy_config:
