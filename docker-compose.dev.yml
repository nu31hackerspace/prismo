# Local development stack. Start it with `./dev.sh` — that script wraps this
# file, waits for the services to become healthy and prints the URLs.
#
# Host ports can be remapped in the root `.env` (see `.env.example`) when
# something else on your machine already owns 3000 / 27017 / 1883 / 5000.
services:
  mongo:
    image: mongo:8
    ports:
      - '${MONGO_PORT:-27017}:27017'
    command: --replSet rs0
    volumes:
      - mongo-dev-data:/data/db
    healthcheck:
      test: mongosh --eval "db.runCommand({ping:1})" --quiet
      interval: 3s
      timeout: 3s
      retries: 10

  mongo-init:
    image: mongo:8
    depends_on:
      mongo:
        condition: service_healthy
    restart: 'no'
    entrypoint: >
      mongosh --host mongo --eval
      "try { rs.status() } catch(e) { rs.initiate({_id:'rs0', members:[{_id:0, host:'mongo:27017'}]}) }"

  mongo-viewer:
    image: haohanyang/compass-web:0.3.1
    restart: unless-stopped
    ports:
      - '${MONGO_VIEWER_PORT:-5000}:8080'
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      - CW_MONGO_URI=mongodb://mongo:27017/?directConnection=true
      - CW_BASIC_AUTH_USERNAME=admin
      - CW_BASIC_AUTH_PASSWORD=admin

  mqtt:
    build: ./mosquitto
    ports:
      - '${MQTT_PORT:-1883}:1883'
      - '9001:9001'
    environment:
      - MQTT_ADMIN_USER=admin
      - MQTT_ADMIN_PASSWORD=admin
    volumes:
      - mqtt-dev-data:/mosquitto/data
    healthcheck:
      test: mosquitto_sub -h localhost -p 1883 -u admin -P admin -t '$$SYS/#' -C 1 -W 2
      interval: 3s
      timeout: 5s
      retries: 10

  app:
    image: node:22
    working_dir: /app
    ports:
      - '${WEB_PORT:-3000}:3000'
      - '24678:24678'
    volumes:
      - ./web:/app
      - app-node-modules:/app/node_modules
      - ./mosquitto:/mqtt
      - mqtt-tools-node-modules:/mqtt/node_modules
      - playwright-browsers:/root/.cache/ms-playwright
    depends_on:
      mongo:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      mqtt:
        condition: service_healthy
    environment:
      - MONGODB_URL=mongodb://mongo:27017/prismo?directConnection=true&replicaSet=rs0
      - MQTT_URL=mqtt://admin:admin@mqtt:1883
      - SESSION_SECRET=dev-secret-not-for-production
      - ORIGIN=${ORIGIN:-https://app.prismo.local.nu31.space}
      - USERNAME=admin
      - PASSWORD=admin
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - MQTT_BROKER=mqtt://mqtt:1883
      - MQTT_USER=admin
      - MQTT_PASSWORD=admin
    healthcheck:
      test: node -e "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s
    command:
      - bash
      - -c
      - |
        echo "skip"
        cd /mqtt && echo "skip" && cd /app
        npm run dev -- -H 0.0.0.0

  mqtt-viewer:
    build: ./mqtt-viewer
    ports:
      - '${MQTT_VIEWER_PORT:-5173}:5173'
    volumes:
      - ./mqtt-viewer:/app
      - mqtt-viewer-node-modules:/app/node_modules
    depends_on:
      mqtt:
        condition: service_healthy
    environment:
      - VITE_MQTT_URL=wss://mqtt.prismo.local.nu31.space
      - VITE_MQTT_USER=admin
      - VITE_MQTT_PASSWORD=admin
    command: npm run dev -- --host 0.0.0.0

  # Firmware build worker. Heavy (~several GB image) and only needed when you
  # work on /flasher builds, so it is opt-in: `./dev.sh up --with-worker`.
  worker:
    image: ghcr.io/nu31hackerspace/prismo-worker:latest
    profiles: [worker]
    depends_on:
      mongo:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      mqtt:
        condition: service_healthy
    volumes:
      - ./web/worker/worker.py:/worker/worker.py:ro
      - ./web/worker/build.sh:/worker/build.sh:ro
    environment:
      - MONGODB_URL=mongodb://mongo:27017/prismo?directConnection=true&replicaSet=rs0
      - MQTT_URL=mqtt://admin:admin@mqtt:1883
    restart: on-failure

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
      - mongo-viewer
      - mqtt-viewer

volumes:
  mongo-dev-data:
  mqtt-dev-data:
  app-node-modules:
  mqtt-tools-node-modules:
  playwright-browsers:
  mqtt-viewer-node-modules:
  caddy_data:
  caddy_config:
