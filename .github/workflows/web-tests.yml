name: Web Tests

on:
  pull_request:

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Start MongoDB with replica set
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:8 --replSet rs0
          until docker exec mongo mongosh --eval "db.runCommand({ping:1})" --quiet; do sleep 1; done
          docker exec mongo mongosh --eval "rs.initiate({_id:'rs0', members:[{_id:0, host:'localhost:27017'}]})"
          sleep 3
          docker exec mongo mongosh --eval "rs.status().ok"

      - name: Build and start Mosquitto
        run: |
          docker build -t prismo-mqtt web/mosquitto
          docker run -d --name mqtt \
            --network host \
            -e MQTT_ADMIN_USER=admin \
            -e MQTT_ADMIN_PASSWORD=admin \
            prismo-mqtt
          for i in $(seq 1 30); do
            if docker exec mqtt mosquitto_sub -h localhost -p 1883 -u admin -P admin -t '#' -C 1 -W 1 2>/dev/null; then break; fi
            if ! docker ps --filter name=mqtt --filter status=running -q | grep -q .; then
              echo "Mosquitto container died, logs:"; docker logs mqtt; exit 1
            fi
            sleep 1
          done
          docker logs mqtt

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Install Playwright browsers
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: web
        env:
          CI: true
          MONGODB_URL: mongodb://localhost:27017/prismo?directConnection=true&replicaSet=rs0
          MQTT_URL: mqtt://localhost:1883
          USERNAME: admin
          PASSWORD: admin
          SESSION_SECRET: ci-test-secret
          GOOGLE_CLIENT_ID: fake-client-id
          GOOGLE_CLIENT_SECRET: fake-client-secret
          ORIGIN: http://localhost:4173
        run: npx playwright test

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 14
