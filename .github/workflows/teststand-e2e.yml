name: Test-stand black-box e2e

# Hardware-in-the-loop end-to-end run on the self-hosted Raspberry Pi test stand:
# brings up the production stack, drives the web UI, flashes the connected
# ESP32-C3, and asserts the physical success pin via the Pi's GPIO.
on:
  workflow_dispatch:
  push:
    branches: [add_black_box_e2e]

# Only one hardware run at a time — the stand has a single device + relay.
concurrency:
  group: teststand-hardware
  cancel-in-progress: false

jobs:
  teststand-e2e:
    runs-on: [test-stand]
    timeout-minutes: 30

    env:
      ESP32_PORT: /dev/ttyESP32C3
      TESTSTAND_SERIAL_PORT: /dev/ttyESP32C3
      COMPOSE_FILES: -f docker-compose.yml -f docker-compose.teststand.yml

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tool sanity check
        run: |
          echo "node:     $(node --version 2>&1 || echo MISSING)"
          echo "npm:      $(npm --version 2>&1 || echo MISSING)"
          echo "docker:   $(docker --version 2>&1 || echo MISSING)"
          echo "mpremote: $(mpremote --version 2>&1 || echo MISSING)"
          echo "esptool:  $(esptool version 2>&1 || esptool.py version 2>&1 || echo MISSING)"
          echo "gpioget:  $(gpioget --version 2>&1 || gpioget -h 2>&1 | head -1 || echo MISSING)"
          ls -l "$ESP32_PORT" || echo "device $ESP32_PORT MISSING"

      - name: Install dependencies
        working-directory: blackbox-e2e
        run: npm ci

      - name: Install Playwright browser
        working-directory: blackbox-e2e
        run: |
          sudo npx playwright install-deps chromium || true
          npx playwright install chromium

      - name: Flash Prismo app onto the device
        run: bash firmware/tests/real_hardware/run_tests.sh

      - name: Start WiFi access point (wlan0)
        # No outer sudo: start-ap.sh sudo's its own nmcli/rfkill calls, which the
        # runner is allowed to do passwordlessly (sudoers.d/prismo-runner).
        run: bash firmware/tests/real_hardware/start-ap.sh

      - name: Start production stack
        working-directory: blackbox-e2e
        run: |
          # Only the app + its deps (mongo, mongo-init, mqtt). The worker isn't
          # needed (firmware is provisioned via mpremote) and its image is multi-GB.
          docker compose $COMPOSE_FILES up --build -d app
          echo "Waiting for the app to become healthy…"
          for i in $(seq 1 60); do
            status=$(docker compose $COMPOSE_FILES ps app --format '{{.Health}}' 2>/dev/null || true)
            if [ "$status" = "healthy" ]; then echo "App healthy."; exit 0; fi
            sleep 3
          done
          echo "App did not become healthy:"; docker compose $COMPOSE_FILES logs --tail 60 app
          exit 1

      - name: Run hardware e2e suite
        working-directory: blackbox-e2e
        run: npm run teststand:test

      - name: Capture diagnostics on failure
        if: failure()
        continue-on-error: true
        run: |
          echo "--- app logs ---"
          (cd blackbox-e2e && docker compose $COMPOSE_FILES logs --tail 80 app) || true
          echo "--- gpio read ---"
          gpioget -c gpiochip4 17 || true
          echo "--- mpremote devs ---"
          mpremote devs || true
          echo "--- wlan0 ---"
          ip -4 addr show wlan0 || true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: blackbox-e2e/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Tear down
        if: always()
        run: |
          (cd blackbox-e2e && docker compose $COMPOSE_FILES down -v) || true
          sudo nmcli connection down prismo-ap || true
