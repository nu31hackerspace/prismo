name: Build and Deploy

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: nu31hackerspace/prismo-web-admin
  HOST: ${{ vars.HOST }}
  SSH_KEY: ${{ secrets.ROOT_SSH_PRIVATE_KEY }}
  COMMIT_SHA: ${{ github.sha }}
  USERNAME: ${{ vars.USERNAME }}
  PASSWORD: ${{ secrets.PASSWORD }}
  GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}

jobs:
  check-dev-flags:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check dev flags are off
        run: |
          FAIL=0
          for flag in DEBUG QUICK_START MUTE_BUZZER; do
            if grep -qP "^${flag}\s*=\s*True" firmware/src/config.py; then
              echo "ERROR: $flag is set to True in firmware/src/config.py — must be False for production builds"
              FAIL=1
            fi
          done
          exit $FAIL

  build-backend-image:
    runs-on: ubuntu-24.04
    needs: check-dev-flags
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:${{ env.COMMIT_SHA }}
          build-args: |
            COMMIT_SHA=${{ env.COMMIT_SHA }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:latest
          cache-to: type=inline

  build-client-image:
    runs-on: ubuntu-24.04
    needs: check-dev-flags
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push client image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: client/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-client:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-client:${{ env.COMMIT_SHA }}
          build-args: |
            VITE_GOOGLE_CLIENT_ID=${{ env.GOOGLE_CLIENT_ID }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-client:latest
          cache-to: type=inline

  deploy:
    runs-on: ubuntu-24.04
    needs:
      - build-backend-image
      - build-client-image
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Create .env file for Docker Stack
        run: |
          echo "IMAGE_NAME='${{ env.IMAGE_NAME }}'" >> .env
          echo "COMMIT_SHA='${{ env.COMMIT_SHA }}'" >> .env
          echo "MONGODB_URL='mongodb://${{ env.USERNAME }}:${{ env.PASSWORD }}@mongo-rs-1:27017/prismo?replicaSet=rs0&authSource=admin'" >> .env
          echo "SESSION_SECRET='${{ secrets.SESSION_SECRET }}'" >> .env
          echo "MQTT_URL='${{ vars.MQTT_URL }}'" >> .env
          echo "PUBLIC_MQTT_URL='${{ vars.PUBLIC_MQTT_URL }}'" >> .env

      - name: Deploy Docker Stack
        uses: cssnr/stack-deploy-action@v1
        with:
          name: prismo
          file: docker-stack.yml
          host: ${{ env.HOST }}
          port: 22
          user: ${{ env.USERNAME }}
          ssh_key: ${{ env.SSH_KEY }}
          env_file: .env
          detach: false
          prune: true
          resolve_image: "always"
          summary: true
