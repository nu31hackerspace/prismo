name: Build and Deploy

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: nu31hackerspace/prismo-web-admin
  WORKER_IMAGE_NAME: nu31hackerspace/prismo-worker
  HOST: ${{ vars.HOST }}
  SSH_KEY: ${{ secrets.ROOT_SSH_PRIVATE_KEY }}
  COMMIT_SHA: ${{ github.sha }}
  USERNAME: ${{ vars.USERNAME }}
  PASSWORD: ${{ secrets.PASSWORD }}

jobs:
  check-dev-flags:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check dev flags are off
        run: |
          FAIL=0
          for flag in DEBUG QUICK_START MUTE_BUZZER; do
            if grep -qP "^${flag}\s*=\s*True" firmware/src/config.py; then
              echo "ERROR: $flag is set to True in firmware/src/config.py — must be False for production builds"
              FAIL=1
            fi
          done
          exit $FAIL

  build-web-image:
    runs-on: ubuntu-24.04
    needs: check-dev-flags
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.COMMIT_SHA }}
          build-args: |
            COMMIT_SHA=${{ env.COMMIT_SHA }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-to: type=inline

  build-worker-image:
    needs: check-dev-flags
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare platform pair
        run: echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV
        env:
          platform: ${{ matrix.platform }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/worker/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.WORKER_IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=worker-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=worker-${{ env.PLATFORM_PAIR }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: worker-digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-worker-image:
    runs-on: ubuntu-24.04
    needs: build-worker-image
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: worker-digests-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/${{ env.WORKER_IMAGE_NAME }}:latest \
            -t ${{ env.REGISTRY }}/${{ env.WORKER_IMAGE_NAME }}:${{ env.COMMIT_SHA }} \
            $(printf '${{ env.REGISTRY }}/${{ env.WORKER_IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect manifest
        run: |
          docker buildx imagetools inspect \
            ${{ env.REGISTRY }}/${{ env.WORKER_IMAGE_NAME }}:${{ env.COMMIT_SHA }}

  deploy:
    runs-on: ubuntu-24.04
    needs:
      - build-web-image
      - merge-worker-image
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Create .env file for Docker Stack
        run: |
          echo "IMAGE_NAME='${{ env.IMAGE_NAME }}'" >> .env
          echo "WORKER_IMAGE_NAME='${{ env.WORKER_IMAGE_NAME }}'" >> .env
          echo "COMMIT_SHA='${{ env.COMMIT_SHA }}'" >> .env
          echo "MONGODB_URL='mongodb://${{ env.USERNAME }}:${{ env.PASSWORD }}@mongo-rs-1:27017/prismo?replicaSet=rs0&authSource=admin'" >> .env
          echo "ORIGIN='https://prismo.nu31.space'" >> .env
          echo "SESSION_SECRET='${{ secrets.SESSION_SECRET }}'" >> .env
          echo "GOOGLE_CLIENT_ID='${{ vars.GOOGLE_CLIENT_ID }}'" >> .env
          echo "GOOGLE_CLIENT_SECRET='${{ secrets.GOOGLE_CLIENT_SECRET }}'" >> .env
          echo "MQTT_URL='${{ vars.MQTT_URL }}'" >> .env
          echo "PUBLIC_MQTT_URL='${{ vars.PUBLIC_MQTT_URL }}'" >> .env

      - name: Deploy Docker Stack
        uses: cssnr/stack-deploy-action@v1
        with:
          name: prismo
          file: web/docker-stack.yml
          host: ${{ env.HOST }}
          port: 22
          user: ${{ env.USERNAME }}
          ssh_key: ${{ env.SSH_KEY }}
          env_file: .env
          detach: false
          prune: true
          resolve_image: "always"
          summary: true
