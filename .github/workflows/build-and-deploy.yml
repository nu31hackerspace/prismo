name: Build and Deploy MicroPython Firmware

on:
  push:
    branches:
      - main
  release:
    types: [created]

jobs:
  build:
    name: Build Firmware
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Checkout MicroPython v1.22.1
        uses: actions/checkout@v4
        with:
          repository: micropython/micropython
          ref: v1.27.0
          path: micropython

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget flex bison gperf python3 python3-pip python3-venv cmake ninja-build ccache libffi-dev libssl-dev dfu-util libusb-1.0-0

      - name: Setup ESP-IDF v5.0.4
        run: |
          git clone -b v5.0.4 --recursive https://github.com/espressif/esp-idf.git esp-idf
          cd esp-idf
          ./install.sh esp32c3
          
      - name: Build mpy-cross
        run: |
          make -C micropython/mpy-cross

      - name: Build MicroPython Firmware
        run: |
          source esp-idf/export.sh
          # Make MicroPython board specifically for ESP32-C3
          # The frozen manifest path is absolute via GITHUB_WORKSPACE
          make -C micropython/ports/esp32 BOARD=ESP32_GENERIC_C3 FROZEN_MANIFEST=$GITHUB_WORKSPACE/firmware/manifest.py
          
      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: micropython/ports/esp32/build-ESP32_GENERIC_C3/firmware.bin

  deploy-pages:
    name: Deploy Web Flasher to GitHub Pages
    runs-on: ubuntu-22.04
    needs: build
    # Only deploy to pages if on main branch or release
    if: github.event_name == 'push' || github.event_name == 'release'
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Download Firmware Artifact
        uses: actions/download-artifact@v4
        with:
          name: firmware
          path: web/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'web'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
