name: Build and Deploy

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: nu31hackerspace/prismo-web-flasher
  WORKER_IMAGE_NAME: nu31hackerspace/prismo-worker
  HOST: ${{ vars.HOST }}
  SSH_KEY: ${{ secrets.ROOT_SSH_PRIVATE_KEY }}
  COMMIT_SHA: ${{ github.sha }}
  USERNAME: ${{ vars.USERNAME }}
  PASSWORD: ${{ secrets.PASSWORD }}

jobs:
  check-dev-flags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check dev flags are off
        run: |
          FAIL=0
          for flag in DEBUG QUICK_START MUTE_BUZZER; do
            if grep -qP "^${flag}\s*=\s*True" firmware/src/config.py; then
              echo "ERROR: $flag is set to True in firmware/src/config.py — must be False for production builds"
              FAIL=1
            fi
          done
          exit $FAIL

  build-web-image:
    runs-on: ubuntu-latest
    needs: check-dev-flags
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: web
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.COMMIT_SHA }}
          build-args: |
            COMMIT_SHA=${{ env.COMMIT_SHA }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-to: type=inline

  build-worker-image:
    runs-on: ubuntu-latest
    needs: check-dev-flags
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/worker/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.WORKER_IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.WORKER_IMAGE_NAME }}:${{ env.COMMIT_SHA }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.WORKER_IMAGE_NAME }}:latest
          cache-to: type=inline

  deploy:
    runs-on: ubuntu-latest
    needs:
      - build-web-image
      - build-worker-image

    steps:
      - uses: actions/checkout@v4

      - name: Create .env file for Docker Stack
        run: |
          echo "IMAGE_NAME='${{ env.IMAGE_NAME }}'" >> .env
          echo "WORKER_IMAGE_NAME='${{ env.WORKER_IMAGE_NAME }}'" >> .env
          echo "COMMIT_SHA='${{ env.COMMIT_SHA }}'" >> .env
          echo "MONGODB_URL='mongodb://${{ env.USERNAME }}:${{ env.PASSWORD }}@mongo-rs-1:27017/prismo?replicaSet=rs0&authSource=admin&directConnection=true'" >> .env
          echo "ORIGIN='https://prismo.nu31.space'" >> .env
          echo "SESSION_SECRET='${{ secrets.SESSION_SECRET }}'" >> .env
          echo "GOOGLE_CLIENT_ID='${{ vars.GOOGLE_CLIENT_ID }}'" >> .env
          echo "GOOGLE_CLIENT_SECRET='${{ secrets.GOOGLE_CLIENT_SECRET }}'" >> .env
          echo "MQTT_URL='${{ vars.MQTT_URL }}'" >> .env

      - name: Deploy Docker Stack
        uses: cssnr/stack-deploy-action@v1
        with:
          name: prismo-web-flasher
          file: web/docker-stack.yml
          host: ${{ env.HOST }}
          port: 22
          user: ${{ env.USERNAME }}
          ssh_key: ${{ env.SSH_KEY }}
          env_file: .env
          detach: false
          prune: true
          resolve_image: "always"
          summary: true
