name: Build MicroPython Firmware

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y git wget flex bison gperf python3-pip python3-venv cmake ninja-build ccache libffi-dev libssl-dev dfu-util libusb-1.0-0

      - name: Build Firmware
        working-directory: firmware
        run: bash build.sh

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prismo-firmware
          path: firmware/dist/
