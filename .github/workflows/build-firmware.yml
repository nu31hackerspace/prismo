name: Build ESP32 MicroPython Firmware

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
    paths:
      - "firmware/**"
      - ".github/workflows/build-firmware.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  MICROPYTHON_VERSION: "1.27.0"
  BOARD: "ESP32_GENERIC_C3"

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v5.4
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Trust workspace for git
        run: git config --global --add safe.directory "*"

      - name: Clone MicroPython
        run: |
          git clone --depth 1 -b v${{ env.MICROPYTHON_VERSION }} \
            https://github.com/micropython/micropython.git \
            micropython-${{ env.MICROPYTHON_VERSION }}

      - name: Build mpy-cross
        run: |
          . $IDF_PATH/export.sh
          make -C micropython-${{ env.MICROPYTHON_VERSION }}/mpy-cross -j$(nproc)

      - name: Freeze custom Python modules
        run: |
          find firmware -maxdepth 1 -name "*.py" \
            -exec cp {} micropython-${{ env.MICROPYTHON_VERSION }}/ports/esp32/modules/ \;

      - name: Initialise port submodules
        run: |
          . $IDF_PATH/export.sh
          cd micropython-${{ env.MICROPYTHON_VERSION }}/ports/esp32
          make BOARD=${{ env.BOARD }} submodules

      - name: Compile firmware
        run: |
          . $IDF_PATH/export.sh
          cd micropython-${{ env.MICROPYTHON_VERSION }}/ports/esp32
          make BOARD=${{ env.BOARD }} -j$(nproc)

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: prismo-esp32-c3-firmware
          path: micropython-${{ env.MICROPYTHON_VERSION }}/ports/esp32/build-${{ env.BOARD }}/firmware.bin
          if-no-files-found: error

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: micropython-${{ env.MICROPYTHON_VERSION }}/ports/esp32/build-${{ env.BOARD }}/firmware.bin