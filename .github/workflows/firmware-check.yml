name: Firmware merge request pipeline

on:
  pull_request:

jobs:
  firmware-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Install ruff
        run: pip install ruff

      - name: Lint firmware
        run: ruff check firmware/

  firmware-real-hardware-tests:
    runs-on: [test-stand]
    timeout-minutes: 15

    env:
      ESP32_PORT: /dev/ttyESP32C3

    steps:
      - uses: actions/checkout@v4

      - name: Tool sanity check
        run: |
          echo "--- mpremote ---"
          mpremote --version
          echo ""
          echo "--- esptool ---"
          esptool version || esptool.py version
          echo ""
          echo "--- device ---"
          ls -l "$ESP32_PORT"

      - name: Run firmware real hardware tests
        working-directory: firmware
        run: bash tests/real_hardware/run_tests.sh

      - name: Capture device state on failure
        if: failure()
        continue-on-error: true
        run: |
          echo "--- dmesg (last 30 USB-related lines) ---"
          dmesg | grep -i -E 'usb|tty|acm' | tail -30 || true
          echo ""
          echo "--- device node ---"
          ls -l "$ESP32_PORT" 2>/dev/null || echo "Device not present"
          echo ""
          echo "--- mpremote devs ---"
          mpremote devs 2>/dev/null || echo "mpremote devs failed"
