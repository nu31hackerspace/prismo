<!DOCTYPE html>
<html>

<head>
    <title>Prismo - First Time Setup</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <h1>Welcome to Prismo!</h1>

    <div class="card">
        <p>Let's secure your device before continuing.</p>

        {error_html}

        <form action="/setup" method="post">
            <div class="form-group">
                <label for="admin_password">Create a Device Password</label>
                <input type="password" id="admin_password" name="admin_password"
                    placeholder="Must be at least 4 characters" minlength="4" required>
            </div>
            <button type="submit">Next: Setup WiFi</button>
        </form>
    </div>
</body>

</html>
